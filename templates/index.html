<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>PairMe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <header>
        <h1>PairMe</h1>
        <div class="sub">P2P File & Text Sharing</div>
    </header>

    <div class="card">
        <h2>Your Device</h2>
        <div class="peer-id" id="my-id">Connecting...</div>
        <div style="margin-top:8px;">
            <div class="row">
                <input type="text" id="my-name" placeholder="Your name" maxlength="20" style="flex:1;">
                <button onclick="updateName()" class="small">Set</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Room</h2>
        <div id="room-status" class="room-info">No room joined</div>
        <div class="row">
            <input type="text" id="room-code-input" placeholder="6-digit code" maxlength="6" inputmode="numeric" style="flex:1;">
            <button onclick="joinRoom()" class="small">Join</button>
        </div>
        <div style="margin-top:8px;">
            <button onclick="createRoom()" class="small secondary">Create Room</button>
            <button onclick="leaveRoom()" class="small secondary">Leave</button>
        </div>
    </div>

    <div class="card">
        <h2>Send Text</h2>
        <textarea id="text-input" placeholder="Type message, link, or paste code..." rows="3"></textarea>
        <select id="text-peer-select">
            <option value="">-- Select peer --</option>
        </select>
        <div style="margin-top:6px;">
            <button onclick="sendText()">Send Text</button>
            <button onclick="sendTextAll()" class="secondary small">Send All</button>
        </div>
    </div>

    <div class="card">
        <h2>Send File</h2>
        <input type="file" id="file-input" multiple>
        <select id="file-peer-select">
            <option value="">-- Select peer --</option>
        </select>
        <div style="margin-top:6px;">
            <button onclick="sendFile()">Send File</button>
            <button onclick="sendFileAll()" class="secondary small">Send All</button>
        </div>
        <div class="progress-bar hidden" id="send-progress-wrap">
            <div class="progress-fill" id="send-progress"></div>
        </div>
        <div class="status" id="send-status"></div>
    </div>

    <div class="card">
        <h2>Nearby Devices</h2>
        <ul class="peer-list" id="peer-list">
            <li style="color:#666;font-style:italic;">No devices found</li>
        </ul>
    </div>

    <div class="card">
        <h2>Received</h2>
        <ul id="received-files"></ul>
    </div>

    <div class="card">
        <h2>Log</h2>
        <div id="log"></div>
    </div>

    <div class="modal-overlay" id="request-modal">
        <div class="modal">
            <h3>Incoming Transfer</h3>
            <p id="request-details"></p>
            <div class="modal-actions">
                <button class="secondary" onclick="respondRequest(false)">Decline</button>
                <button onclick="respondRequest(true)">Accept</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
